plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
}

// Stonecutter runs this script once per version with that version's
// versions/<mc>/gradle.properties loaded.
def mc = project.minecraft_version
def javaVer = project.java_version.toInteger()

version = "${project.mod_version}+${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // OPTIONAL: a pure-Java WebP reader so the pack browser can show PacksMC's WebP previews. Delete this line to
    // build without it; previews then fall back to coloured placeholders and everything else is unchanged.
    include(implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0"))
}

processResources {
    def props = [version: project.version, minecraft_dep: project.minecraft_dep]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVer
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
}
